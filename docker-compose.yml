services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chera:latest
    container_name: chera
    ports:
      - "${CHERA_PORT:-8000}:8000"
    volumes:
      - chera-data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  chera-data:
